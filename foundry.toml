[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 15

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
base = "${BASE_RPC_URL}"
